function roster(){return `<h2>Roster & Records</h2><section class="panel"><h3>Add wrestler</h3><form onsubmit="addW(event)"><div class="fields"><div><label>Ring name</label><input name="name" required maxlength="70"></div><div><label>Brand / promotion</label><input name="brand" placeholder="RAW, SmackDown, AEW..." maxlength="50"></div><div><label>Championship (optional)</label><input name="title" placeholder="World Champion" maxlength="80"></div></div><p><button>Add Wrestler</button></p></form></section><section class="panel scroll"><table><thead><tr><th>Wrestler</th><th>Brand</th><th>Title</th><th>W</th><th>L</th><th>D</th><th>Win %</th><th></th></tr></thead><tbody>${db.roster.map(w=>{let r=record(w),total=r.wins+r.losses+r.draws;return `<tr><td><b>${esc(w.name)}</b></td><td>${esc(w.brand)}</td><td>${esc(w.title)}</td><td>${r.wins}</td><td>${r.losses}</td><td>${r.draws}</td><td>${total?(100*r.wins/total).toFixed(0):0}%</td><td><button class="secondary small" onclick="editW('${w.id}')">Edit</button> <button class="danger small" onclick="removeW('${w.id}')">×</button></td></tr>`}).join('')}</tbody></table>${!db.roster.length?'<div class="empty">Your roster is empty.</div>':''}</section>`};function addW(e){e.preventDefault();let d=new FormData(e.target);db.roster.push({id:id(),name:d.get('name').trim(),brand:d.get('brand').trim(),title:d.get('title').trim()});save()};function editW(i){let w=db.roster.find(w=>w.id===i);let n=prompt('Ring name',w.name);if(n===null||!n.trim())return;let b=prompt('Brand / promotion',w.brand);if(b===null)return;let t=prompt('Championship',w.title);if(t===null)return;Object.assign(w,{name:n.trim(),brand:b.trim(),title:t.trim()});save()};function removeW(i){if(!confirm('Remove this wrestler? Past matches will remain but display “Removed wrestler”.'))return;db.roster=db.roster.filter(w=>w.id!==i);save()}
function book(){return `<h2>Book a Weekly Show</h2><section class="panel"><div class="fields"><div><label>Show name</label><input id="showtitle" placeholder="Monday Night RAW" value="${esc(window.showtitleDraft||'')}"></div><div><label>Show date</label><input id="showdate" type="date" value="${datestr()}"></div><div><label>Overall show rating (1–10)</label><input id="showrating" type="number" min="1" max="10" step="0.5" value="8"></div></div><label>Show notes</label><textarea id="shownotes" placeholder="Promos, crowd reactions, surprises..."></textarea></section><section class="panel"><h3>Add a match result</h3>${db.roster.length<2?'<p class="muted">Add at least two wrestlers first.</p>':''}<div class="fields"><div><label>Wrestler A</label><select id="ma">${opt()}</select></div><div><label>Wrestler B</label><select id="mb">${opt()}</select></div><div><label>Match type</label><input id="mtype" placeholder="Singles, Ladder, Cage..." value="Singles"></div><div><label>Winner</label><select id="mw"><option value="a">Wrestler A</option><option value="b">Wrestler B</option><option value="draw">Draw / No contest</option></select></div><div><label>Match rating (1–5 stars)</label><input id="mrating" type="number" min="1" max="5" step="0.5" value="3.5"></div></div><label>Match notes</label><input id="mnotes" placeholder="Finish, interference, storyline angle..."><p><button onclick="addMatch()" ${db.roster.length<2?'disabled':''}>+ Add Match to Card</button></p></section><section class="panel"><h3>Match Card (${draft.length})</h3>${draft.map((m,i)=>`<div class="result"><div class="cardrow"><div><b>${esc(name(m.a))} vs ${esc(name(m.b))}</b><div class="small muted">${esc(m.type)} · Winner: ${m.winner==='draw'?'Draw':esc(name(m.winner))} · ★ ${m.rating}/5</div><div class="small">${esc(m.notes)}</div></div><button class="danger" onclick="draft.splice(${i},1);render()">Remove</button></div></div>`).join('')||'<div class="empty">No matches added yet.</div>'}<p><button class="green" onclick="finishShow()">✓ Save Completed Show</button></p></section>`};function addMatch(){let a=document.getElementById('ma').value,b=document.getElementById('mb').value;if(!a||!b||a===b)return alert('Choose two different wrestlers.');let w=document.getElementById('mw').value;draft.push({id:id(),a,b,winner:w==='draw'?'draw':w==='a'?a:b,type:document.getElementById('mtype').value.trim()||'Singles',rating:+document.getElementById('mrating').value,notes:document.getElementById('mnotes').value.trim()});window.showtitleDraft=document.getElementById('showtitle').value;render()};function finishShow(){let title=document.getElementById('showtitle').value.trim(),date=document.getElementById('showdate').value,rating=+document.getElementById('showrating').value;if(!title||!date||rating<1||rating>10)return alert('Enter a show name, date and valid rating.');if(!draft.length&&!confirm('Save a show with no matches?'))return;db.shows.push({id:id(),title,date,rating,notes:document.getElementById('shownotes').value,matches:[...draft]});draft=[];window.showtitleDraft='';tab='Show History';save()}
function history(){return `<h2>Weekly Show History</h2>${db.shows.length?'':'<div class="empty">No shows saved yet.</div>'}${[...db.shows].reverse().map(s=>`<section class="panel"><div class="cardrow"><div><h3>${esc(s.title)} <span class="pill">★ ${s.rating}/10</span></h3><div class="muted small">${esc(s.date)} · ${s.matches.length} matches · Avg match ★ ${avg(s.matches.map(m=>m.rating))}/5</div></div><button class="danger" onclick="deleteShow('${s.id}')">Delete show</button></div><p>${esc(s.notes)}</p>${s.matches.map(m=>`<div class="result"><b>${esc(name(m.a))} vs ${esc(name(m.b))}</b><div class="small muted">${esc(m.type)} · Winner: ${m.winner==='draw'?'Draw':esc(name(m.winner))} · ★ ${m.rating}/5</div><div class="small">${esc(m.notes)}</div></div>`).join('')}</section>`).join('')}`};function deleteShow(i){if(confirm('Delete this show and remove its results from all wrestler records?')){db.shows=db.shows.filter(s=>s.id!==i);save()}}
const angles=[['Betrayal','{a} turns on {b} after a tag-team victory. The rivalry begins with a shocking attack.'],['Championship obsession','{a} demands a title opportunity against {b}, promising to put their career on the line.'],['Mystery attacker','{b} is attacked backstage. Security footage points toward {a}, but the truth remains uncertain.'],['Unexpected alliance','{a} and {b} join forces against a common enemy, despite their troubled history.'],['Surprise return','{a} makes a dramatic return and interrupts {b} during an in-ring celebration.'],['Respect becomes hatred','A competitive match between {a} and {b} ends in controversy, turning mutual respect into a bitter feud.'],['Stolen victory','{a} costs {b} a crucial match through interference. A rematch with a special stipulation is demanded.'],['Tournament chaos','{a} and {b} reach the final of a tournament, but a disputed finish creates a new rivalry.'],['Faction recruitment','{a} tries to recruit {b} into a new faction. The response triggers an unexpected conflict.'],['Career-defining challenge','{a} challenges {b} to a best-of-three series, with the loser forced to leave the brand.']];function stories(){return `<h2>Storyline Generator</h2><section class="panel"><p class="muted">Generate a random angle using two wrestlers, then save it to your universe.</p><div class="fields"><div><label>Wrestler A (optional)</label><select id="sa">${opt()}</select></div><div><label>Wrestler B (optional)</label><select id="sb">${opt()}</select></div></div><p><button onclick="generateStory()">🎲 Generate Random Storyline</button></p><div id="generated"></div></section><h3>Saved Storylines</h3>${db.stories.map(s=>`<div class="panel"><div class="cardrow"><div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p><span class="pill">${esc(s.status)}</span></div><div><button class="secondary" onclick="toggleStory('${s.id}')">Change status</button> <button class="danger" onclick="deleteStory('${s.id}')">×</button></div></div></div>`).join('')||'<div class="empty">No storylines saved.</div>'}`};let generated=null;function generateStory(){if(db.roster.length<2)return alert('Add at least two wrestlers first.');let a=document.getElementById('sa').value,b=document.getElementById('sb').value;let pool=db.roster.map(w=>w.id);if(!a)a=pool[Math.floor(Math.random()*pool.length)];if(!b){let choices=pool.filter(i=>i!==a);b=choices[Math.floor(Math.random()*choices.length)]}if(a===b)return alert('Select different wrestlers.');let angle=angles[Math.floor(Math.random()*angles.length)];generated={title:angle[0],text:angle[1].replaceAll('{a}',name(a)).replaceAll('{b}',name(b))};document.getElementById('generated').innerHTML=`<div class="result"><h3>${esc(generated.title)}</h3><p>${esc(generated.text)}</p><button onclick="saveStory()">Save Storyline</button></div>`};function saveStory(){if(!generated)return;db.stories.unshift({id:id(),...generated,status:'Active'});generated=null;save()};function toggleStory(i){let s=db.stories.find(x=>x.id===i);s.status=s.status==='Active'?'Completed':'Active';save()};function deleteStory(i){if(confirm('Delete this storyline?')){db.stories=db.stories.filter(s=>s.id!==i);save()}}

njuries=db.injuries.filter(x=>x.id!==i);save()}}
function backup(){return `<h2>Backup & Restore</h2><section class="panel"><h3>Export your universe</h3><p class="muted">Download all wrestlers, match results, storylines and injuries as a JSON file. Your data is stored only on this device and browser unless you export it.</p><button onclick="exportData()">⬇ Export Backup</button></section><section class="panel"><h3>Import a backup</h3><p class="muted">Restoring a backup replaces your current universe.</p><input type="file" id="restore" accept=".json,application/json"><p><button class="secondary" onclick="importData()">Restore Backup</button></p></section><section class="panel"><h3>Start fresh</h3><button class="danger" onclick="resetData()">Erase Universe</button></section>`};function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ringbook-backup-'+datestr()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(){let f=document.getElementById('restore').files[0];if(!f)return alert('Choose a backup file.');try{let data=JSON.parse(await f.text());if(!['roster','shows','injuries','stories'].every(k=>Array.isArray(data[k])))throw Error('Invalid backup format');if(confirm('Replace all current data with this backup?')){db=data;draft=[];save()}}catch(e){alert('Could not restore backup: '+e.message)}}function resetData(){if(confirm('Permanently erase all data in this browser?')&&confirm('This cannot be undone without a backup. Continue?')){db={roster:[],shows:[],injuries:[],stories:[]};draft=[];save()}}

 <section class="panel"><h3>Title Lineage</h3>${db.titleHistory.length?db.titleHistory.map(h=>`<div class="result cardrow"><div><b>${esc(h.title)}</b> · ${esc(name(h.wrestler))}<div class="small muted">${esc(h.date)} · ${esc(h.event||'Title awarded')} ${h.type==='vacated'?'· Vacated':''}</div></div><button class="danger" onclick="removeTitleEvent('${h.id}')">×</button></div>`).join(''):'<div class="empty">Title changes will appear here.</div>'}</section>`;

function addTitleChange(e){

 <section class="panel"><h3>Active Teams & Factions</h3>${db.teams.map(t=>`<div class="result"><div class="cardrow"><div><h3>${esc(t.name)} <span class="pill">${esc(t.type)}</span></h3><div class="small muted">${esc(t.brand||'Independent')}</div><p>${t.members.map(i=>esc(name(i))).join(' • ')}</p></div><button class="danger" onclick="deleteTeam('${t.id}')">Delete</button></div></div>`).join('')||'<div class="empty">Create your first team or faction.</div>'}</section>`;

function deleteTeam(i){if(confirm('Delete this group?')){db.teams=db.teams.filter(t=>t.id!==i);save()}}
function power(w){
 const r=record(w),all=db.shows.flatMap(s=>s.matches).filter(m=>(m.teamA||[m.a]).includes(w.id)||(m.teamB||[m.b]).includes(w.id));
 const recent=all.slice(-5),recentWins=recent.filter(m=>m.winner!=='draw'&&((m.teamA||[m.a]).includes(w.id)&&m.winner===m.a||(m.teamB||[m.b]).includes(w.id)&&m.winner===m.b)).length;
 const matchQuality=all.length?all.reduce((n,m)=>n+(Number(m.rating)||0),0)/all.length:0;
 return Math.round(r.wins*10-r.losses*3+r.draws*2+recentWins*8+matchQuality*4+(w.title?15:0));
}

let matchMode='singles';
function matchSides(m){return [m.teamA||[m.a],m.teamB||[m.b]]}
function matchLabel(m){const [a,b]=matchSides(m);return `${a.map(name).join(' & ')} vs ${b.map(name).join(' & ')}`}
function winnerLabel(m){if(m.winner==='draw')return 'Draw / No contest';const [a,b]=matchSides(m);return (m.winner===m.a?a:b).map(name).join(' & ')}
function matchModeChange(value){captureShowDraft();matchMode=value;render()}
function matchPick(n,label){return `<div><label>${label}</label><select id="${n}">${opt()}</select></div>`}
book=function(){
 const count=matchMode==='tag'?4:2;
 return `<h2>Book a Weekly Show</h2><section class="panel"><div class="fields"><div><label>Show name</label><input id="showtitle" placeholder="Monday Night RAW" value="${esc(showDraft.title)}"></div><div><label>Show date</label><input id="showdate" type="date" value="${esc(showDraft.date)}"></div><div><label>Automatic show rating (1–10)</label><input id="showrating" type="number" readonly value="${autoRating(draft)}"><div class="small muted">Average match stars × 2</div></div></div><label>Show notes</label><textarea id="shownotes" placeholder="Promos, crowd reactions, surprises...">${esc(showDraft.notes)}</textarea></section>
 <section class="panel"><h3>Add a match result</h3><label>Match format</label><select id="matchformat" onchange="matchModeChange(this.value)"><option value="singles" ${matchMode==='singles'?'selected':''}>Singles — 1 vs 1</option><option value="tag" ${matchMode==='tag'?'selected':''}>Tag Team — 2 vs 2</option></select>
 ${db.roster.length<count?`<p class="muted">Add at least ${count} wrestlers to book this match.</p>`:''}
 <div class="fields">${matchPick('ma','Team A · Wrestler 1')}${matchMode==='tag'?matchPick('ma2','Team A · Wrestler 2'):''}${matchPick('mb','Team B · Wrestler 1')}${matchMode==='tag'?matchPick('mb2','Team B · Wrestler 2'):''}
 <div><label>Match type</label><input id="mtype" value="${matchMode==='tag'?'Tag Team':'Singles'}" placeholder="Tag, Ladder, Cage..."></div><div><label>Winner</label><select id="mw"><option value="a">${matchMode==='tag'?'Team A':'Wrestler A'}</option><option value="b">${matchMode==='tag'?'Team B':'Wrestler B'}</option><option value="draw">Draw / No contest</option></select></div><div><label>Match rating (1–5 stars)</label><input id="mrating" type="number" min="1" max="5" step="0.5" value="3.5"></div></div>
 <label>Match notes</label><input id="mnotes" placeholder="Finish, interference, storyline angle..."><p><button onclick="addMatch()" ${db.roster.length<count?'disabled':''}>+ Add Match to Card</button></p></section>
 <section class="panel"><h3>Match Card (${draft.length})</h3>${draft.map((m,i)=>`<div class="result"><div class="cardrow"><div><b>${esc(matchLabel(m))}</b><div class="small muted">${esc(m.type)} · Winner: ${esc(winnerLabel(m))} · ★ ${m.rating}/5</div><div class="small">${esc(m.notes)}</div></div><button class="danger" onclick="captureShowDraft();draft.splice(${i},1);render()">Remove</button></div></div>`).join('')||'<div class="empty">No matches added yet.</div>'}<p><button class="green" onclick="finishShow()">✓ Save Completed Show</button></p></section>`;
};
addMatch=function(){
 captureShowDraft();
 const ids=[document.getElementById('ma')?.value,...(matchMode==='tag'?[document.getElementById('ma2')?.value]:[]),document.getElementById('mb')?.value,...(matchMode==='tag'?[document.getElementById('mb2')?.value]:[])];
 if(ids.some(v=>!v)||new Set(ids).size!==ids.length)return alert(`Choose ${ids.length} different wrestlers.`);
 const rating=Number(document.getElementById('mrating').value);
 if(!Number.isFinite(rating)||rating<1||rating>5)return alert('Enter a match rating between 1 and 5.');
 const teamA=ids.slice(0,matchMode==='tag'?2:1),teamB=ids.slice(matchMode==='tag'?2:1),winner=document.getElementById('mw').value;
 draft.push({id:id(),a:teamA[0],b:teamB[0],teamA,teamB,winner:winner==='draw'?'draw':winner==='a'?teamA[0]:teamB[0],type:document.getElementById('mtype').value.trim()||(matchMode==='tag'?'Tag Team':'Singles'),rating,notes:document.getElementById('mnotes').value.trim()});
 render();
};
history=function(){return `<h2>Weekly Show History</h2>${db.shows.length?'':'<div class="empty">No shows saved yet.</div>'}${[...db.shows].reverse().map(s=>`<section class="panel"><div class="cardrow"><div><h3>${esc(s.title)} <span class="pill">★ ${s.rating}/10</span></h3><div class="muted small">${esc(s.date)} · ${s.matches.length} matches · Avg match ★ ${avg(s.matches.map(m=>m.rating))}/5</div></div><button class="danger" onclick="deleteShow('${s.id}')">Delete show</button></div><p>${esc(s.notes)}</p>${s.matches.map(m=>`<div class="result"><b>${esc(matchLabel(m))}</b><div class="small muted">${esc(m.type)} · Winner: ${esc(winnerLabel(m))} · ★ ${m.rating}/5</div><div class="small">${esc(m.notes)}</div></div>`).join('')}</section>`).join('')}`};

db.contracts ??= [];

 <div><label>Challenger</label><select name="challenger" required>${opt()}</select></div>

function addDefense(e){
 e.preventDefault();const f=new FormData(e.target),champion=f.get('champion'),challenger=f.get('challenger'),title=String(f.get('title')||'').trim(),result=f.get('result');
 if(!champion||!challenger||champion===challenger||!title)return alert('Choose two different wrestlers and a championship.');
 const current=db.roster.find(w=>w.id===champion);
 if(result==='lost'){
   if(!confirm('Transfer this championship to the challenger?'))return;
   db.roster.forEach(w=>{if((w.title||'').toLowerCase()===title.toLowerCase())w.title=''});
   const newChampion=db.roster.find(w=>w.id===challenger);newChampion.title=title;
   db.titleHistory.unshift({id:id(),title,wrestler:challenger,date:f.get('date'),event:String(f.get('event')||'Title defense'),type:'won'});
 } else if(current && !current.title){current.title=title}
 db.defenses.unshift({id:id(),title,champion,challenger,result,date:String(f.get('date')),event:String(f.get('event')||'').trim(),notes:String(f.get('notes')||'').trim()});save();
}
function deleteDefense(i){if(confirm('Delete this defense entry? This will not reverse a championship transfer.')){db.defenses=db.defenses.filter(x=>x.id!==i);save()}}
function contractStatus(c){if(c.status==='Released')return 'Released';if(!c.end)return 'Active · open-ended';const days=Math.ceil((new Date(c.end+'T12:00:00')-new Date())/86400000);return days<0?'Expired':days<=30?`Expiring in ${days} days`:'Active'}
function contractsPage(){
 const active=db.contracts.filter(c=>contractStatus(c).startsWith('Active')||contractStatus(c).startsWith('Expiring'));
 const weekly=active.reduce((a,c)=>a+(c.payPeriod==='Weekly'?Number(c.salary):c.payPeriod==='Monthly'?Number(c.salary)*12/52:Number(c.salary)/52),0);
 return `<h2>💵 Wrestler Contracts & Salaries</h2>
 <div class="grid"><div class="stat"><span>Active contracts</span><strong>${active.length}</strong></div><div class="stat"><span>Estimated weekly payroll</span><strong>${fmtMoney(weekly)}</strong></div><div class="stat"><span>Expiring within 30 days</span><strong>${active.filter(c=>contractStatus(c).startsWith('Expiring')).length}</strong></div></div>
 <section class="panel"><h3>Sign or renew a wrestler</h3><form onsubmit="addContract(event)"><div class="fields">
 <div><label>Wrestler</label><select name="wrestler" required>${opt()}</select></div>
 <div><label>Salary ($)</label><input name="salary" type="number" min="0" step="0.01" required placeholder="2500"></div>
 <div><label>Pay frequency</label><select name="payPeriod"><option>Weekly</option><option>Monthly</option><option>Yearly</option></select></div>
 <div><label>Start date</label><input name="start" type="date" value="${datestr()}" required></div>
 <div><label>End date (optional)</label><input name="end" type="date"></div>
 <div><label>Brand / promotion</label><input name="brand" maxlength="70" placeholder="Rise Above Wrestling"></div></div>
 <label>Contract notes</label><textarea name="notes" placeholder="Bonus, role, special terms..."></textarea>
 <p><button ${db.roster.length?'':'disabled'}>Save Contract</button></p></form></section>
 <section class="panel"><h3>Contract Ledger</h3>${db.contracts.map(c=>`<div class="result"><div class="cardrow"><div><b>${esc(name(c.wrestler))}</b> <span class="pill">${esc(contractStatus(c))}</span><p>${fmtMoney(c.salary)} / ${esc(c.payPeriod.toLowerCase())} · ${esc(c.brand||'Independent')}</p><div class="small muted">${esc(c.start)} to ${esc(c.end||'Open-ended')}</div><div class="small">${esc(c.notes||'')}</div></div><div><button class="secondary small" onclick="toggleContract('${c.id}')">${c.status==='Released'?'Reactivate':'Release'}</button> <button class="danger small" onclick="deleteContract('${c.id}')">Delete</button></div></div></div>`).join('')||'<div class="empty">No contracts signed yet.</div>'}</section>
 <p class="muted small">Salaries are fantasy booking values, not real payments. Weekly payroll estimates normalize monthly and yearly amounts.</p>`;
}
function addContract(e){
 e.preventDefault();const f=new FormData(e.target),w=f.get('wrestler'),start=f.get('start'),end=f.get('end'),salary=Number(f.get('salary'));
 if(!w||!db.roster.some(x=>x.id===w)||!Number.isFinite(salary)||salary<0||end&&end<start)return alert('Check wrestler, salary, and dates.');
 db.contracts=db.contracts.filter(c=>c.wrestler!==w||c.status==='Released');
 db.contracts.unshift({id:id(),wrestler:w,salary,payPeriod:f.get('payPeriod'),start,end,brand:String(f.get('brand')||''),notes:String(f.get('notes')||''),status:'Active'});save();
}
function toggleContract(i){const c=db.contracts.find(c=>c.id===i);if(c){c.status=c.status==='Released'?'Active':'Released';save()}}
function deleteContract(i){if(confirm('Delete this contract?')){db.contracts=db.contracts.filter(c=>c.id!==i);save()}}
const previousInjuries=injuries;
injuries=function(){

 return `<div class="grid"><div class="stat"><span>Currently injured</span><strong>${active.length}</strong></div><div class="stat"><span>Expected upcoming returns</span><strong>${upcoming.length}</strong></div></div>`+

};

/* v1.2 — 1–100% match ratings, in-universe news after each three completed shows, PNG brand logo. */
const RA_V12='1.2';
const raPct=m=>Math.max(1,Math.min(100,Math.round(Number(m.ratingScale===100?m.rating:Number(m.rating)*20)||1)));
const raShowPct=s=>s.ratingScale===100?Math.round(Number(s.rating)||0):Math.round(Number(s.rating||0)*10);
autoRating=function(matches){return matches.length?String(Math.round(matches.reduce((sum,m)=>sum+raPct(m),0)/matches.length)):'0'};
const raBookPrevious=book;
book=function(){
 let h=raBookPrevious();
 h=h.replace('Automatic show rating (1–10)','Automatic show rating (1–100%)');
 h=h.replace('Average match stars × 2','Average match rating in percent');
 h=h.replace(/<label>Match rating \(1–5 stars\)<\/label><input id="mrating" type="number" min="1" max="5" step="0.5" value="3.5">/g,
 '<label>Match rating (1–100%)</label><input id="mrating" type="number" min="1" max="100" step="1" value="75">');
 h=h.replace(/★ \$\{m\.rating\}\/5/g,'${raPct(m)}%');
 return h;
};
addMatch=function(){
 captureShowDraft();
 const ids=[document.getElementById('ma')?.value,...(matchMode==='tag'?[document.getElementById('ma2')?.value]:[]),document.getElementById('mb')?.value,...(matchMode==='tag'?[document.getElementById('mb2')?.value]:[])];
 if(ids.some(v=>!v)||new Set(ids).size!==ids.length)return alert('Choose different wrestlers for each position.');
 const rating=Number(document.getElementById('mrating')?.value);
 if(!Number.isInteger(rating)||rating<1||rating>100)return alert('Enter a whole-number match rating from 1 to 100%.');
 const a=ids.slice(0,matchMode==='tag'?2:1),b=ids.slice(matchMode==='tag'?2:1),win=document.getElementById('mw').value;
 draft.push({id:id(),a:a[0],b:b[0],teamA:a,teamB:b,winner:win==='draw'?'draw':win==='a'?a[0]:b[0],type:document.getElementById('mtype').value.trim()||(matchMode==='tag'?'Tag Team':'Singles'),rating,ratingScale:100,notes:document.getElementById('mnotes').value.trim()});
 render();
};
finishShow=function(){
 captureShowDraft();
 const title=document.getElementById('showtitle')?.value.trim(),date=document.getElementById('showdate')?.value,notes=document.getElementById('shownotes')?.value||'';
 if(!title||!date)return alert('Enter a show name and date.');
 if(!draft.length)return alert('Add at least one match before completing a show.');
 const rating=Number(autoRating(draft));
 db.shows.push({id:id(),title,date,rating,ratingScale:100,notes,matches:[...draft]});
 draft=[];showDraft={title:'',date:datestr(),notes:''};window.showtitleDraft='';tab='Show History';save();
 if(db.shows.length%3===0)alert('📰 Wrestling News updated! '+db.shows.length+' shows completed. Open Wrestling News for your latest universe headlines.');
};
history=function(){
 return `<h2>Weekly Show History</h2><p class="muted">Match and show ratings use a 1–100% scale. Earlier five-star matches are displayed as equivalent percentages.</p>${db.shows.length?'':'<div class="empty">No shows saved yet.</div>'}${[...db.shows].reverse().map(s=>`<section class="panel"><div class="cardrow"><div><h3>${esc(s.title)} <span class="pill">${raShowPct(s)}%</span></h3><div class="muted small">${esc(s.date)} · ${s.matches.length} matches · Avg match ${s.matches.length?Math.round(s.matches.reduce((sum,m)=>sum+raPct(m),0)/s.matches.length):0}%</div></div><button class="danger" onclick="deleteShow('${s.id}')">Delete show</button></div><p>${esc(s.notes)}</p>${s.matches.map(m=>`<div class="result"><b>${esc(matchLabel(m))}</b><div class="small muted">${esc(m.type)} · Winner: ${esc(winnerLabel(m))} · ${raPct(m)}%</div><div class="small">${esc(m.notes)}</div></div>`).join('')}</section>`).join('')}`;
};
function raNews(){
 const complete=Math.floor(db.shows.length/3),remaining=3-db.shows.length%3;
 const batches=Array.from({length:complete},(_,i)=>{
  const group=db.shows.slice(i*3,i*3+3),all=group.flatMap(s=>s.matches),best=all.length?[...all].sort((a,b)=>raPct(b)-raPct(a))[0]:null;
  const high=[...group].sort((a,b)=>raShowPct(b)-raShowPct(a))[0];
  const wins=new Map();
  all.forEach(m=>{if(m.winner==='draw')return;const team=m.winner===m.a?(m.teamA||[m.a]):(m.teamB||[m.b]);team.forEach(w=>wins.set(w,(wins.get(w)||0)+1))});
  const leader=[...wins].sort((a,b)=>b[1]-a[1])[0];
  return {number:i+1,shows:group,high,best,leader};
 }).reverse();
 return `<h2>📰 Wrestling News</h2><p class="muted">Your universe's fictional wrestling news is compiled automatically after every 3 completed shows. No internet or external news feed required.</p>
 <section class="panel"><h3>Newsroom Progress</h3><p><b>${db.shows.length}</b> completed shows · <b>${complete}</b> news editions published</p><p class="muted">${complete?'Next edition in '+remaining+' show'+(remaining===1?'':'s')+'.':'Complete '+remaining+' more show'+(remaining===1?'':'s')+' to unlock your first news edition.'}</p></section>
 ${batches.map(b=>`<section class="panel"><h3>🗞️ Edition #${b.number} · Shows ${b.number*3-2}–${b.number*3}</h3>
 <div class="result"><b>🔥 ${esc(b.high.title)} tops the card!</b><p>Best-rated show in this edition: ${esc(b.high.title)} (${raShowPct(b.high)}%).</p></div>
 ${b.best?`<div class="result"><b>🏅 Match of the edition</b><p>${esc(matchLabel(b.best))} earned ${raPct(b.best)}%.</p></div>`:''}
 ${b.leader?`<div class="result"><b>💪 Momentum watch</b><p>${esc(name(b.leader[0]))} picked up ${b.leader[1]} win${b.leader[1]===1?'':'s'} across these three shows.</p></div>`:''}

if ('serviceWorker' in navigator && location.protocol==='https:') {
 let updating=false;
 const notice=document.getElementById('updateNotice');
 const showUpdate=()=>{notice.hidden=false};
 document.getElementById('updateLater').onclick=()=>{notice.hidden=true};
 document.getElementById('updateNow').onclick=async()=>{
   if(!confirm('Export a backup before updating if you have important changes. Update now?'))return;
   const reg=await navigator.serviceWorker.getRegistration();
   if(reg?.waiting){updating=true;reg.waiting.postMessage({type:'SKIP_WAITING'})}
   else location.reload();
 };
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(updating)location.reload();else showUpdate()});
 window.addEventListener('load',async()=>{
   try{
     const reg=await navigator.serviceWorker.register('./service-worker.js');
     if(reg.waiting&&navigator.serviceWorker.controller)showUpdate();
     reg.addEventListener('updatefound',()=>{
       const worker=reg.installing;
       worker?.addEventListener('statechange',()=>{
         if(worker.state==='installed'&&navigator.serviceWorker.controller)showUpdate();
       });
     });
     document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
     window.addEventListener('online',()=>reg.update().catch(()=>{}));
     reg.update().catch(()=>{});
   }catch(e){console.warn('Update check unavailable',e)}
 });
}
